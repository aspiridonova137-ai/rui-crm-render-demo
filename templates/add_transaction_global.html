{% extends "base.html" %}
{% block title %}Add Transaction — CRM{% endblock %}

{% block content %}
<div class="back-link" style="margin-bottom:16px;">
    <a href="{{ url_for('transactions_list') }}">← Back to Transactions</a>
</div>

<div class="page-header">
    <h1>Add Transaction</h1>
</div>

<div class="card">
    <form method="POST" id="tx-form">
        <div class="form-group">
            <label for="client_id">Client <span style="color:#e74c3c;">*</span></label>
            <select id="client_id" name="client_id" required onchange="filterCases()">
                <option value="">— Select client —</option>
                {% for c in clients %}
                <option value="{{ c['id'] }}"
                    {% if preselected_client == c['id']|string %}selected{% endif %}>
                    {{ c['full_name'] }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="case_id">Related Case <span style="color:#999;">(optional)</span></label>
            <select id="case_id" name="case_id">
                <option value="">— None —</option>
                {% for c in all_cases %}
                <option value="{{ c['id'] }}"
                        data-client="{{ c['client_id'] }}"
                        {% if preselected_case == c['id']|string %}selected{% endif %}>
                    {{ c['case_code'] }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="type">Type <span style="color:#e74c3c;">*</span></label>
            <select id="type" name="type" required>
                <option value="payment">Payment (money received from client)</option>
                <option value="expense">Expense (money spent for client)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="amount">Amount (€) <span style="color:#e74c3c;">*</span></label>
            <input type="number" id="amount" name="amount" step="0.01" min="0.01"
                   placeholder="e.g. 150.00" required autofocus />
        </div>
        <div class="form-group">
            <label for="note">Note <span style="color:#999;">(optional)</span></label>
            <input type="text" id="note" name="note" placeholder="e.g. Court filing fee, Initial retainer…" />
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-success">Save Transaction</button>
            <a href="{{ url_for('transactions_list') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<script>
function filterCases() {
    var clientId = document.getElementById('client_id').value;
    var caseSelect = document.getElementById('case_id');
    var options = caseSelect.querySelectorAll('option[data-client]');
    options.forEach(function(opt) {
        opt.style.display = (!clientId || opt.getAttribute('data-client') === clientId) ? '' : 'none';
    });
    // Reset case if it belongs to another client
    var selected = caseSelect.querySelector('option[value="' + caseSelect.value + '"]');
    if (selected && selected.getAttribute('data-client') && selected.getAttribute('data-client') !== clientId) {
        caseSelect.value = '';
    }
}
// Run on page load to apply preselected client filter
document.addEventListener('DOMContentLoaded', filterCases);
</script>
{% endblock %}
