{% extends "base.html" %}
{% block title %}Add Activity — CRM{% endblock %}

{% block content %}
<div class="back-link" style="margin-bottom:16px;">
    <a href="{{ url_for('activities_list') }}">← Back to Activities</a>
</div>

<div class="page-header">
    <h1>Add Activity</h1>
</div>
<p style="color:#555;margin-bottom:20px;font-size:14px;">Select the case this activity belongs to.</p>

<div class="card">
    <form method="POST" id="act-form">
        <div class="form-group">
            <label for="client_id">Client <span style="color:#999;">(filter)</span></label>
            <select id="client_id" name="client_id_filter" onchange="filterCases()">
                <option value="">All clients</option>
                {% for c in clients %}
                <option value="{{ c['id'] }}">{{ c['full_name'] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="case_id">Case <span style="color:#e74c3c;">*</span></label>
            <select id="case_id" name="case_id" required>
                <option value="">— Select case —</option>
                {% for c in all_cases %}
                <option value="{{ c['id'] }}" data-client="{{ c['client_id'] }}">
                    {{ c['client_name'] }} / {{ c['case_code'] }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-success">Continue</button>
            <a href="{{ url_for('activities_list') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<script>
function filterCases() {
    var clientId = document.getElementById('client_id').value;
    var caseSelect = document.getElementById('case_id');
    var options = caseSelect.querySelectorAll('option[data-client]');
    options.forEach(function(opt) {
        opt.style.display = (!clientId || opt.getAttribute('data-client') === clientId) ? '' : 'none';
    });
    if (caseSelect.value) {
        var sel = caseSelect.querySelector('option[value="' + caseSelect.value + '"]');
        if (sel && sel.getAttribute('data-client') && clientId && sel.getAttribute('data-client') !== clientId) {
            caseSelect.value = '';
        }
    }
}
</script>
{% endblock %}
