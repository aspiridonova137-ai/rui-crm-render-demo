{% extends "base.html" %}
{% block title %}Edit Client — CRM{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Edit Client</h1>
</div>

<div class="card">
    <form method="POST">
        <div class="form-group">
            <label for="full_name">Full Name <span style="color:#e74c3c;">*</span></label>
            <input type="text" id="full_name" name="full_name" value="{{ client['full_name'] }}" required />
        </div>
        <div class="form-group">
            <label for="phone">Phone Number <span style="color:#999;">(optional)</span></label>
            <input type="text" id="phone" name="phone" value="{{ client['phone'] or '' }}" />
        </div>
        <div class="form-group">
            <label for="whatsapp_number">WhatsApp Number <span style="color:#999;">(optional)</span></label>
            <input type="text" id="whatsapp_number" name="whatsapp_number" value="{{ client['whatsapp_number'] or '' }}" />
        </div>
        <div class="form-group">
            <label for="email">Email <span style="color:#999;">(optional)</span></label>
            <input type="email" id="email" name="email" value="{{ client['email'] or '' }}" />
        </div>
        <div class="form-group">
            <label for="id_number">ID Number <span style="color:#999;">(optional)</span></label>
            <input type="text" id="id_number" name="id_number" value="{{ client['id_number'] or '' }}" />
        </div>
        <div class="form-group">
            <label for="address">Address <span style="color:#999;">(optional)</span></label>
            <input type="text" id="address" name="address" value="{{ client['address'] or '' }}" />
        </div>
        <div class="form-group">
            <label for="vat_number">VAT Number <span style="color:#999;">(optional)</span></label>
            <input type="text" id="vat_number" name="vat_number" value="{{ client['vat_number'] or '' }}" />
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-success">Update Client</button>
            <a href="{{ url_for('client_detail', client_id=client['id']) }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
